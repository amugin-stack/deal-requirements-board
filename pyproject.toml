[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-board"
version = "0.10.0"
description = "Broker deal posts to structured requirements to licensed, ranked broker matches."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
# Exact pins, moved here from requirements.txt (now deleted) so there is one source of truth.
# This is an application, not a library: exact pins keep eval runs reproducible across machines.
dependencies = [
    "anthropic==1.15.0",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "starlette==1.10.0",  # imported directly by api.py (ASGI types); the version fastapi 0.162.0 resolves to
    "uvicorn==0.54.0",
    # Transitive runtime closure, pinned too (versions as installed when these pins were set).
    # The transport that carries the API key (httpx2 -> httpcore2 -> h11/truststore/idna/anyio)
    # must be pinned, not left to whatever a range resolves to on the day of install; the rest
    # of the closure is pinned for the same reproducibility reason as the direct pins above.
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "click==8.5.0",
    "docstring-parser==0.18.0",
    "h11==0.16.0",
    "httpcore2==2.15.1",
    "httpx2==2.15.1",  # anthropic's HTTP client (runtime); also Starlette's TestClient and the tests' fake errors
    "idna==3.20",
    "jiter==0.18.0",
    "opentelemetry-api==1.45.1",
    "pydantic-core==2.50.1",
    "sniffio==1.3.1",
    "truststore==0.10.5",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[project.scripts]
deal-eval = "deal_board.cli.eval:run"
deal-build-brokers = "deal_board.cli.build_brokers:run"

[tool.setuptools.packages.find]
include = ["deal_board*"]
namespaces = false  # deal_board/extractors/frozen/ is source kept as data, never a package

[tool.setuptools.package-data]
"deal_board.extractors" = ["frozen/*.py"]
"deal_board" = ["ui_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode puts nothing on sys.path, so tests pass only if deal_board is installed.
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
target-version = "py314"
# frozen/: byte-identical to tag baseline-v1 by owner rule, so it is neither linted nor formatted.
# results/: eval output data, not code.
# review/: read-only review artifacts, frozen evidence by their own success rule, not package code.
extend-exclude = ["deal_board/extractors/frozen", "results", "review"]

[tool.ruff.lint]
# Sensible, not maximal: correctness (E, W, F, B), import order (I), modern syntax (UP),
# simplifications (SIM, C4) and ruff's own checks (RUF).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# E501: line length is the formatter's job.
# RUF001-003: en dashes and ± in user-facing strings and comments are intentional.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# UP042: StrEnum changes str()/format() of members ("retail" vs "PropertyType.retail"); keep behavior.
"deal_board/schema.py" = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["deal_board"]

[tool.ruff.format]
quote-style = "double"
# Markdown is prose and agent-graph records; its code blocks are illustrations, not code to format.
exclude = ["*.md"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["deal_board", "loop", "tests"]
# frozen/ is the byte-identical baseline-v1 source, kept as data and loaded via a typed wrapper.
exclude = ['^deal_board/extractors/frozen/']
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
