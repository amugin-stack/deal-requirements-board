# Lint, type-check and run the offline test suite on every push and pull request.
# No secrets are used: the suite runs without ANTHROPIC_API_KEY and makes no network calls
# (the eval CLI skips Claude when the key is missing). The only network access is pip install.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ""  # explicitly empty: config treats "" as no key
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags: a test compares the frozen baseline with tag baseline-v1. The tags
          # are lightweight, so push them explicitly (git push origin baseline-v1 loop-start).
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy --strict
        run: mypy --strict
      - name: pytest (offline)
        run: pytest -q
